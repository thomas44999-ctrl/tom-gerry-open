<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tom &amp; Gerry Open – Dev</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #stats {
    position: fixed; left: 8px; top: 8px; z-index: 50; pointer-events: none;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e9f1f7;
    background: rgba(8, 12, 16, 0.62); padding: 5px 8px; border-radius: 6px; white-space: pre;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #stats:empty { display: none; }
  #err {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 100; max-height: 60vh; overflow: auto;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffd9d6; background: rgba(60, 8, 8, 0.92);
    border: 1px solid #ff6b5e; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="stats"></div>
<div id="err"></div>
<script type="module">
  import { Renderer } from './src/gfx/renderer.js';
  import { params } from './src/core/util.js';
  import { createDevkit } from './test/scenes/devkit.js';

  const errEl = document.getElementById('err');
  const shown = new Set();
  function showError(e, where = '') {
    const msg = (e && (e.stack || e.message)) ? `${e.message || e}\n${(e.stack || '').split('\n').slice(1, 8).join('\n')}` : String(e);
    const text = (where ? `[${where}] ` : '') + msg;
    if (shown.has(text)) return;
    shown.add(text);
    errEl.style.display = 'block';
    errEl.textContent += (errEl.textContent ? '\n\n' : '') + text;
  }
  window.__showError = showError;
  window.addEventListener('error', (ev) => showError(ev.error || ev.message, 'error'));
  window.addEventListener('unhandledrejection', (ev) => showError(ev.reason, 'promise'));

  const scene = (params.get('scene', 'gfxtest') || 'gfxtest').replace(/[^\w-]/g, '');
  document.title = `dev: ${scene}`;
  const canvas = document.getElementById('c');
  window.__dev = { scene, ready: false, frames: 0 };

  let renderer = null;
  try {
    renderer = new Renderer(canvas, {
      quality: params.get('quality', 'high'),
      dynamicResolution: params.bool('dynres', !params.has('t')),
      renderScale: params.num('scale', 1),
    });
    if (params.has('scale')) renderer.dynamicResolution = false;
  } catch (e) {
    console.error(e);
    showError(e, 'renderer');
  }
  window.__dev.renderer = renderer;

  const devkit = createDevkit(renderer, canvas, params);
  devkit.statsEl = params.bool('stats', true) ? document.getElementById('stats') : null;
  devkit.onError = (e, where) => { console.error(e); showError(e, where); };
  window.__dev.devkit = devkit;

  try {
    const mod = await import(`./test/scenes/${scene}.js`);
    if (typeof mod.run !== 'function') throw new Error(`Szene "${scene}" exportiert keine Funktion run(ctx).`);
    await mod.run({ renderer, canvas, params, devkit });
  } catch (e) {
    console.error(e);
    showError(e, `scene:${scene}`);
  }
</script>
</body>
</html>
